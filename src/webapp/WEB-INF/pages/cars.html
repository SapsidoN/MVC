
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Car List</title>
</head>
<body>
<div>
  <h1>Car List</h1>

  <table border="1">
    <thead>
    <tr>
      <th>Model</th>
      <th>VIN</th>
      <th>Number</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="car : ${cars}">
      <td th:text="${car.model}"></td>
      <td th:text="${car.vin}"></td>
      <td th:text="${car.number}"></td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
